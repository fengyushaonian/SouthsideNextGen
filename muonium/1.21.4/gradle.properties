# Gradle
# 标准库由 FLK/KFF 提供；编译基线在 gradle/kotlin-support.gradle 单独约束。
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true

# 本文件已去掉原 1.21.11 树里的本机事实：
#   org.gradle.java.home / org.gradle.java.installations.paths（C:/Users/24914 下的 JDK）
#   systemProp.*.proxyHost（127.0.0.1:7890）
# 那些是原开发者机器上的配置，在 CI 或任何别的机器上都会直接失败。
# JDK 由 CI 的 setup-java 提供，代理按环境变量自行设置。

# Fabric Properties
minecraft_version=1.21.4
# 共享源码统一用 Mojang 官方名（mojmap），这样同一份 src/ 也能编进 NeoForge 侧。
# Fabric 侧用 loom.officialMojangMappings()，NeoForge 侧由 ModDevGradle 直接给官方名。
# 开发/编译期用的 Loader。发布出去的 jar 声明的下限是下面的 loader_min_version，不是这个值。
loader_version=0.18.1
# fabric.mod.json 里声明的 Loader 下限。0.17.0 是 1.21.4 一代的常见下限。
loader_min_version=0.17.0

# Mod Properties
mod_version=2.5.2
maven_group=com.muoniumplayer
archives_base_name=MuoniumPlayer

# Dependencies
# fabric-api 0.119.2+1.21.4 与 Southside 主工程用的同一版本，同进程不会出现两份 API。
fabric_version=0.119.2+1.21.4
# Fabric 侧 Kotlin 运行时最低支持版本。
# 1.13.12+kotlin.2.4.0 与 1.21.11 树同版；FLK 只依赖 fabric-loader，不绑定 MC 版本。
fabric_language_kotlin_version=1.13.12+kotlin.2.4.0

# ==================== NeoForge ====================
# 本树（内建进 Southside 用）只构建 Fabric 侧，NeoForge 子工程不参与。
# 保留键位是为了共享的 gradle 脚本能读到，不要用于本车道构建。
neoforge_version=21.4.100
neoforge_min_version=21.4.0
kotlinforforge_version=6.0.0
