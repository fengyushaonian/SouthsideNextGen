plugins {
    id 'fabric-loom' version '1.13.6'
}

version = '2.0.1'

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

loom {
    accessWidenerPath = file('src/main/resources/southside.accesswidener')
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'southside-refmap.json'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings files('mappings/yarn-1.21.4+build.8-v2.jar')
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4'
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.0'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'net.java.dev.jna:jna-platform:5.15.0'
    compileOnly 'org.apache.httpcomponents:httpclient:4.5.14'
    compileOnly 'org.lwjgl:lwjgl-nanovg:3.3.3'
    implementation fileTree('src/main/resources/META-INF/jars') { include '*.jar' }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

// ==================== 内建 MuoniumPlayer（Jar-in-Jar）====================
// 把 muonium/1.21.4 车道的产物作为嵌套 jar 打进本 mod，运行期由 Fabric Loader
// 展开成独立的子 mod（id = muonium）。这是 Fabric 官方的「内建另一个 mod」机制。
//
// 构建顺序：先 `cd muonium/1.21.4 && gradlew :fabric:build`，再构建本工程。
// 直接跑本工程的 build 而没有先构建 Muonium 时，这里会跳过并打印提示 ——
// 不会静默产出一个「少了播放器」的包。
def muoniumJarName = 'MuoniumPlayer-1.21.4-fabric-2.5.2.jar'
def muoniumJar = file("muonium/1.21.4/fabric/build/libs/${muoniumJarName}")

tasks.named('processResources') {
    if (muoniumJar.exists()) {
        from(muoniumJar) {
            into 'META-INF/jars'
        }
        doFirst {
            logger.lifecycle("[Muonium] 内嵌 ${muoniumJarName}（${muoniumJar.length()} 字节）")
        }
    } else {
        doFirst {
            logger.warn("[Muonium] 未找到 ${muoniumJar}，本次产物不含内建播放器。")
            logger.warn("[Muonium] 先执行: cd muonium/1.21.4 && ./gradlew :fabric:build")
        }
    }
}

tasks.named('jar') {
    manifest.from('src/main/resources/META-INF/MANIFEST.MF')
    exclude('META-INF/MANIFEST.MF')
    archiveClassifier = 'dev'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('remapJar') {
    archiveClassifier = 'rebuilt'
    destinationDirectory = layout.buildDirectory.dir('libs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
